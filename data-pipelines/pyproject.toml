[project]
name = "shockt-data-pipelines"
version = "0.1.0"
description = "Ingestion pipelines and dbt models for the ShockT Climate raw and core layers."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13",
  "boto3>=1.34",
  "dbt-core>=1.9",
  "dbt-postgres>=1.9",
  "google-cloud-bigquery>=3.25",
  "httpx>=0.27",
  "polars>=1.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "searoute>=1.4",
  "sqlalchemy>=2.0",
  "tenacity>=8.2",
  "typer>=0.12",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shockt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
