name: shockt
version: "0.1.0"
config-version: 2
profile: shockt

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  shockt:
    staging:
      +schema: core_staging
      +materialized: view
      +grants:
        select: ["shockt_analyst"]
    core:
      +schema: core
      +materialized: table
      +grants:
        select: ["shockt_analyst", "shockt_app"]

seeds:
  shockt:
    +schema: raw
    +grants:
      select: ["shockt_analyst"]
    seed_census_countries:
      +column_types: {census_cty_code: text, cty_name: text, iso2: text, iso3: text, source: text}
    seed_census_ports:
      +column_types: {port_code: text, port_name: text, district_code: text, source: text}
    seed_hs_case_codes:
      +column_types: {hs_prefix: text, cases: text, source: text}
    seed_sea_distances:
      +column_types: {from_node_id: text, to_node_id: text, scenario: text, km: numeric, passages: text, source: text}
    seed_air_distances:
      +column_types: {from_node_id: text, to_node_id: text, km: numeric, source: text}
    seed_road_distances:
      +column_types: {from_node_id: text, to_node_id: text, km: numeric, duration_h: numeric, osm_date: text, graph_date: text, engine_version: text, source: text}
    seed_rail_distances:
      +column_types: {from_node_id: text, to_node_id: text, km: numeric, from_snap_km: numeric, to_snap_km: numeric, network_version: text, source: text}
