name: shockt
version: "0.1.0"
config-version: 2
profile: shockt

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Largest share of case air tonnage allowed at Census ports with no matched airport.
  air_port_max_unmatched_share: 0.01
  # Radius around a Census port's city within which its large airport is chosen.
  air_port_city_radius_km: 50

models:
  shockt:
    staging:
      +schema: core_staging
      +materialized: view
      +grants:
        select: ["shockt_analyst"]
    core:
      +schema: core
      +materialized: table
      +grants:
        select: ["shockt_analyst", "shockt_app"]

seeds:
  shockt:
    +schema: raw
    +grants:
      select: ["shockt_analyst"]
    seed_census_countries:
      +column_types: {census_cty_code: text, cty_name: text, iso2: text, iso3: text, source: text}
    seed_census_ports:
      +column_types: {port_code: text, port_name: text, district_code: text, source: text}
    seed_hs_case_codes:
      +column_types: {hs_prefix: text, level: text, label: text, cases: text, source: text}
    seed_emission_factors:
      +column_types:
        factor_id: text
        mode: text
        variant: text
        region: text
        ttw_kg_co2e_per_tkm: numeric
        wtt_kg_co2e_per_tkm: numeric
        wtw_kg_co2e_per_tkm: numeric
        ttw_source: text
        wtt_source: text
        gwp_basis: text
        notes: text
