version: 2

x-modes: &modes
  accepted_values:
    arguments:
      values: ["air", "vessel", "vessel_containerized", "other"]

models:
  - name: dim_country
    description: Census Schedule C countries with ISO3 and analysis region.
    columns:
      - name: census_cty_code
        data_tests: [unique, not_null]
      - name: region
        description: >
          A region of config/origins.yaml, or `other`; `assert_regions_are_configured_origins` checks it.

  - name: dim_port
    description: >
      Census Schedule D ports, each placed at a point (a US–Mexico crossing, a named airport, its
      GeoNames city or an airport in its municipality) and given a coast region by `coast_region`,
      the same rule as the Climate TRACE ports. `assert_census_port_coast_regions` pins known ports;
      `assert_census_ports_located` bounds the tonnage at ports with no point.
    columns:
      - name: port_code
        data_tests: [unique, not_null]
      - name: is_border_crossing
        description: A US–Mexico crossing in BTS Border Crossing Entry Data.
        data_tests: [not_null]
      - name: location_method
        data_tests:
          - accepted_values:
              arguments:
                values: ["border_crossing", "airport_name", "geonames_city", "airport_municipality", "unmatched"]
      - name: coast_region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["west", "gulf", "east", "inland", "noncontiguous", "other", "unknown"]

  - name: dim_hs
    description: HS-10 codes seen in the country-level data, with the cases they belong to.
    columns:
      - name: hs10
        data_tests: [unique, not_null]

  - name: fct_imports_monthly
    description: >
      Country-level imports by month, HS-10, country and mode. Weight is reported by Census for air and
      vessel only; `other` (overland for Mexico and Canada) has value but no weight.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs10", "census_cty_code", "mode"]
    columns:
      - name: mode
        data_tests: [*modes]
      - name: hs10
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_hs')
                field: hs10
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code

  - name: fct_imports_port_monthly
    description: Imports by month, HS-6, country, port of unlading and mode, with the port's coast region.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs6", "census_cty_code", "port_code", "mode"]
    columns:
      - name: mode
        data_tests: [*modes]
      - name: port_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_port')
                field: port_code
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code

  - name: fct_imports_state_monthly
    description: Imports by month, HS-6, country, state of destination and mode.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs6", "census_cty_code", "state", "mode"]
    columns:
      - name: mode
        data_tests: [*modes]
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code

  - name: ref_emission_factors
    description: >
      Every freight emission factor per tonne-km in the UK government conversion factors and the
      EPA GHG Emission Factors Hub, in kg CO2e: tank-to-wheel, well-to-tank and well-to-wheel. UK
      factors are paired with their own well-to-tank rows; EPA factors (combustion only) take the
      UK well-to-tank ratio of the fuel `epa_vehicle_fuel` assigns. Which factor a leg uses is the
      engine's rule (plan section 6.1).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["source", "variant"]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(wtw_kg_co2e_per_tkm - ttw_kg_co2e_per_tkm - wtt_kg_co2e_per_tkm) < 0.000002"
          config:
            where: "wtw_kg_co2e_per_tkm is not null"
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: ["uk_desnz", "epa_hub"]
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["ocean", "air", "truck", "rail", "other"]
      - name: ttw_kg_co2e_per_tkm
        data_tests: [not_null]
      - name: wtw_kg_co2e_per_tkm
        description: >
          Null only for EPA vehicle types with no fuel assigned. Every UK factor has one: a UK
          freight row without exactly one well-to-tank pair fails this test or the uniqueness test.
        data_tests:
          - not_null:
              config:
                where: "source = 'uk_desnz' or fuel is not null"

  - name: fct_chokepoint_transits_daily
    description: >
      Daily ship transits through the configured chokepoints (IMF PortWatch), by ship type, with
      estimated trade volume in metric tons (each ship's estimated payload share × deadweight tonnage).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["date", "chokepoint_id"]
    columns:
      - name: chokepoint_id
        description: A PortWatch ID from config/sources.yaml; the loader rejects rows for any other.
        data_tests: [not_null]
      - name: n_total
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= n_cargo"

  - name: fct_chokepoint_transits_monthly
    description: Monthly totals and daily means of chokepoint transits; a partial month has fewer `days_reported`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "chokepoint_id"]

  - name: fct_voyages
    description: >
      Container-ship voyages (Climate TRACE) from the configured Asian origins and Mexico to US ports.
      `vessel_type` is `container` for OceanMind and `cargo.container` for Global Fishing Watch voyages.
      Distance is the distance sailed; emissions are total CO2e (100-year GWP) for the voyage.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["asset_identifier", "started_at"]
    columns:
      - name: distance_km
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn
      - name: model_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["om", "gfw"]
              config:
                severity: warn
      - name: end_coast_region
        description: From dim_climatetrace_ports, assigned from the arrival port's coordinates.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["west", "gulf", "east", "inland", "noncontiguous", "other", "unknown"]
      - name: origin_region
        description: A region of config/origins.yaml; `assert_regions_are_configured_origins` checks it.
        data_tests: [not_null]

  - name: agg_voyage_lanes_monthly
    description: >
      Container-ship voyages by start month, origin country and US coast region: voyage count,
      distance sailed, duration and CO2e. `co2e_t_per_km` is total CO2e over total distance.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "origin_iso3", "end_coast_region"]

  - name: dim_climatetrace_ports
    description: >
      US arrival ports in the Climate TRACE voyages, rebuilt on every run: median coordinates of the
      voyages' end points, the most common port name, the coast region from the `coast_region` macro,
      and voyage counts (all ship types and container ships) for the loaded years and lanes.
    columns:
      - name: end_port_id
        data_tests: [unique, not_null]
      - name: coast_region
        data_tests:
          - accepted_values:
              arguments:
                values: ["west", "gulf", "east", "inland", "noncontiguous", "other", "unknown"]

  - name: dim_census_air_ports
    description: >
      Census ports with air imports of the case HS codes, each placed at an OurAirports airport by a
      scripted match: by airport name when the port name names an airport, else the nearest large
      airport within `air_ports.city_radius_km` (config/transforms.yaml) of the port's GeoNames
      city, else the nearest airport; a city GeoNames lacks is matched by airport municipality. Unmatched ports have null coordinates and are left out of the nodes;
      `assert_air_ports_unmatched_share_within_limit` bounds their share of air tonnage.
    columns:
      - name: port_code
        data_tests: [unique, not_null]
      - name: air_weight_share
        description: The port's share of case air tonnage over all loaded months.
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["airport_name", "large_near_city", "nearest_to_city", "city_municipality", "unmatched"]
      - name: city_to_airport_km
        description: For city ports, the distance from the GeoNames city to the chosen airport.
