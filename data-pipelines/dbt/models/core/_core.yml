version: 2

x-modes: &modes
  accepted_values:
    arguments:
      values: ["air", "vessel", "vessel_containerized", "other"]

models:
  - name: dim_country
    description: Census Schedule C countries with ISO3 and analysis region.
    columns:
      - name: census_cty_code
        data_tests: [unique, not_null]
      - name: region
        description: >
          A region of config/origins.yaml, or `other`; `assert_regions_are_configured_origins` checks it.

  - name: dim_port
    description: >
      Census Schedule D ports, each placed at a point (a US–Mexico crossing, a named airport, its
      GeoNames city or an airport in its municipality) and given a coast region by `coast_region`,
      the same rule as the Climate TRACE ports. `assert_census_port_coast_regions` pins known ports;
      `assert_census_ports_located` bounds the tonnage at ports with no point.
    columns:
      - name: port_code
        data_tests: [unique, not_null]
      - name: is_border_crossing
        description: A US–Mexico crossing in BTS Border Crossing Entry Data.
        data_tests: [not_null]
      - name: location_method
        data_tests:
          - accepted_values:
              arguments:
                values: ["border_crossing", "airport_name", "geonames_city", "airport_municipality", "unmatched"]
      - name: coast_region
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["west", "gulf", "east", "inland", "noncontiguous", "other", "unknown"]

  - name: dim_hs
    description: HS-10 codes seen in the country-level data, with the cases they belong to.
    columns:
      - name: hs10
        data_tests: [unique, not_null]

  - name: fct_imports_monthly
    description: >
      Country-level imports by month, HS-10, country and mode. Weight is reported by Census for air and
      vessel only; `other` (overland for Mexico and Canada) has value but no weight.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs10", "census_cty_code", "mode"]
    columns:
      - name: mode
        data_tests: [*modes]
      - name: hs10
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_hs')
                field: hs10
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code

  - name: fct_imports_port_monthly
    description: Imports by month, HS-6, country, port of unlading and mode, with the port's coast region.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs6", "census_cty_code", "port_code", "mode"]
    columns:
      - name: mode
        data_tests: [*modes]
      - name: port_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_port')
                field: port_code
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code

  - name: fct_imports_state_port_quarterly
    description: >
      Imports of all goods (no HS code) by quarter, state of destination, port of unlading, port of
      entry, country and mode (air and vessel only), from Census State/Port Imports, with the
      unlading port's coast region. No `other` mode: the load drops rows without air or vessel weight.
      Supports the Case 2 inland-routing check: the share of vessel imports bound for a state that
      was unladen on the West Coast.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["quarter", "state", "unlading_port_code", "entry_port_code", "census_cty_code", "mode"]
    columns:
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["air", "vessel", "vessel_containerized"]
      - name: unlading_port_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_port')
                field: port_code
      - name: entry_port_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_port')
                field: port_code
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code
      - name: unlading_coast_region
        data_tests: [not_null]

  - name: agg_air_vessel_kg_per_usd
    description: >
      Kg per dollar of air and vessel imports by HS-6 and origin over the loaded months, and across all
      origins (`census_cty_code` null): the basis for estimating overland weight from value.
      `meets_minimum` marks origins whose air and vessel value reaches
      `overland_weight.min_air_vessel_value_usd` (config/transforms.yaml). The all-origins row carries
      the range: value-weighted percentiles (`overland_weight.range_percentiles`) of kg per dollar
      across origins that meet the minimum.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["hs6", "census_cty_code"]
    columns:
      - name: kg_per_usd
        data_tests: [not_null]

  - name: fct_mexico_overland_monthly
    description: >
      Imports from Mexico across the land border by month, HS-6, border crossing and mode (truck,
      rail): Census overland value at each crossing, split by TransBorder's truck and rail shares for
      the chapter, with weight estimated from the code's kg per dollar in air and vessel shipments and
      a range from value-weighted percentiles across origins (plan section 7.3). `assert_mexico_overland_value_fully_split`
      checks every Census row is split.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs6", "port_code", "mode"]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "weight_t_low <= weight_t + 0.000001 and weight_t <= weight_t_high + 0.000001"
    columns:
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["truck", "rail"]
      - name: port_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_port')
                field: port_code
      - name: weight_t
        data_tests: [not_null]
      - name: weight_t_low
        data_tests: [not_null]
      - name: weight_t_high
        data_tests: [not_null]
      - name: ratio_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["origin", "all_origins"]
      - name: split_source
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["crossing", "district", "national"]

  - name: fct_imports_state_monthly
    description: Imports by month, HS-6, country, state of destination and mode.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "hs6", "census_cty_code", "state", "mode"]
    columns:
      - name: mode
        data_tests: [*modes]
      - name: census_cty_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_country')
                field: census_cty_code

  - name: ref_emission_factors
    description: >
      Every freight emission factor per tonne-km in the UK government conversion factors and the
      EPA GHG Emission Factors Hub, in kg CO2e: tank-to-wheel, well-to-tank and well-to-wheel. UK
      factors are paired with their own well-to-tank rows; EPA factors (combustion only) take the
      UK well-to-tank ratio of the fuel `epa_vehicle_fuel` assigns. Which factor a leg uses is the
      engine's rule (plan section 6.1).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["source", "variant"]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs(wtw_kg_co2e_per_tkm - ttw_kg_co2e_per_tkm - wtt_kg_co2e_per_tkm) < 0.000002"
          config:
            where: "wtw_kg_co2e_per_tkm is not null"
    columns:
      - name: source
        data_tests:
          - accepted_values:
              arguments:
                values: ["uk_desnz", "epa_hub"]
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ["ocean", "air", "truck", "rail", "other"]
      - name: ttw_kg_co2e_per_tkm
        data_tests: [not_null]
      - name: wtw_kg_co2e_per_tkm
        description: >
          Null only for EPA vehicle types with no fuel assigned. Every UK factor has one: a UK
          freight row without exactly one well-to-tank pair fails this test or the uniqueness test.
        data_tests:
          - not_null:
              config:
                where: "source = 'uk_desnz' or fuel is not null"

  - name: fct_chokepoint_transits_daily
    description: >
      Daily ship transits through the configured chokepoints (IMF PortWatch), by ship type, with
      estimated trade volume in metric tons (each ship's estimated payload share × deadweight tonnage).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["date", "chokepoint_id"]
    columns:
      - name: chokepoint_id
        description: A PortWatch ID from config/sources.yaml; the loader rejects rows for any other.
        data_tests: [not_null]
      - name: n_total
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= n_cargo"

  - name: fct_chokepoint_transits_monthly
    description: Monthly totals and daily means of chokepoint transits; a partial month has fewer `days_reported`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "chokepoint_id"]

  - name: fct_voyages
    description: >
      Container-ship voyages (Climate TRACE) from the configured Asian origins and Mexico to US ports.
      `vessel_type` is `container` for OceanMind and `cargo.container` for Global Fishing Watch voyages.
      Distance is the distance sailed; emissions are total CO2e (100-year GWP) for the voyage.
      Voyages whose recorded end point contradicts their end port (a US arrival ending outside the US)
      are excluded; `assert_contradicting_end_points_within_limit` bounds how many.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["asset_identifier", "started_at"]
    columns:
      - name: distance_km
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"
              config:
                severity: warn
      - name: model_source
        data_tests:
          - accepted_values:
              arguments:
                values: ["om", "gfw"]
              config:
                severity: warn
      - name: end_coast_region
        description: From dim_climatetrace_ports, assigned from the arrival port's coordinates.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["west", "gulf", "east", "inland", "noncontiguous", "other", "unknown"]
      - name: origin_region
        description: A region of config/origins.yaml; `assert_regions_are_configured_origins` checks it.
        data_tests: [not_null]

  - name: agg_voyage_lanes_monthly
    description: >
      Container-ship voyages by start month, origin country and US coast region: voyage count,
      distance sailed, duration and CO2e. `co2e_t_per_km` is total CO2e over total distance.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["month", "origin_iso3", "end_coast_region"]

  - name: dim_climatetrace_ports
    description: >
      US arrival ports in the Climate TRACE voyages, rebuilt on every run: median coordinates of the
      voyages' end points, the most common port name, the coast region from the `coast_region` macro,
      and voyage counts (all ship types and container ships) for the loaded years and lanes.
    columns:
      - name: end_port_id
        data_tests: [unique, not_null]
      - name: coast_region
        data_tests:
          - accepted_values:
              arguments:
                values: ["west", "gulf", "east", "inland", "noncontiguous", "other", "unknown"]

  - name: dim_census_air_ports
    description: >
      Census ports with air imports of the case HS codes, each placed at an OurAirports airport by a
      scripted match: by airport name when the port name names an airport, else the nearest large
      airport within `air_ports.city_radius_km` (config/transforms.yaml) of the port's GeoNames
      city, else the nearest airport; a city GeoNames lacks is matched by airport municipality. Unmatched ports have null coordinates and are left out of the nodes;
      `assert_air_ports_unmatched_share_within_limit` bounds their share of air tonnage.
    columns:
      - name: port_code
        data_tests: [unique, not_null]
      - name: air_weight_share
        description: The port's share of case air tonnage over all loaded months.
      - name: match_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["airport_name", "large_near_city", "nearest_to_city", "city_municipality", "unmatched"]
      - name: city_to_airport_km
        description: For city ports, the distance from the GeoNames city to the chosen airport.

  - name: dim_departure_ports
    description: >
      Climate TRACE start ports in the origin countries that container ships sailed from to the US,
      each at the median start point of its voyages.
    columns:
      - name: start_port_id
        data_tests: [unique, not_null]
      - name: iso3
        data_tests: [not_null]

  - name: dim_departure_airports
    description: >
      Airports in the origin countries that flew freight to the US in BTS T-100, placed by IATA code
      and country with OurAirports.
    columns:
      - name: iata_code
        data_tests: [unique, not_null]
      - name: iso3
        data_tests: [not_null]

  - name: dim_mexico_plants
    description: >
      DENUE establishments in the case industries whose employee band starts at or above
      `mexico_sites.min_employees`, one per industry and location.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["lat", "lon", "scian_code"]
    columns:
      - name: plant_id
        data_tests: [unique, not_null]

  - name: map_crossing_plant
    description: >
      The nearest large plant, by great-circle distance, for each border crossing and HS-6 code with
      overland imports, among codes whose industries DENUE covers. `assert_nearest_plant_rules` pins
      known crossings.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["port_code", "hs6"]
    columns:
      - name: plant_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_mexico_plants')
                field: plant_id

  - name: dim_destination_states
    description: US states of destination with case imports, at the population-weighted centre of their GeoNames cities.
    columns:
      - name: state
        data_tests: [unique, not_null]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]

  - name: dim_nodes
    description: >
      Every place a leg starts or ends: departure ports and airports, US arrival seaports, air
      gateways and border crossings, Mexican plants and US destination states. `node_id` is the kind
      and the key in the source it came from.
    columns:
      - name: node_id
        data_tests: [unique, not_null]
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["departure_port", "departure_airport", "arrival_seaport", "air_gateway", "border_crossing", "mexico_plant", "destination_state"]
      - name: lat
        data_tests: [not_null]
      - name: lon
        data_tests: [not_null]
