      - tariffs_2025
      - panama_red_sea
  # Liquid-dielectric transformers.
  - prefix: "850421"
    cases:
      - panama_red_sea
  - prefix: "850422"
    cases:
      - panama_red_sea
  - prefix: "850423"
    cases:
      - panama_red_sea
  # Dry transformers above 16 kVA.
  - prefix: "850433"
    cases:
      - panama_red_sea
  - prefix: "850434"
    cases:
      - panama_red_sea
  # Switchgear and switchboards above 1,000 V.
  - prefix: "853720"
    cases:
      - panama_red_sea
