# Source settings for the ingestion CLI. Command-line flags override the date range.
# Filters applied at load time are recorded in raw.load_manifest.params.

date_range:
  start_month: "2022-01"
  # null resolves to the latest month each source has published at load time.
  end_month: null

census_api:
  base_url: https://api.census.gov/data/timeseries/intltrade/imports
  # An HS-4 prefix at HS-10 can take about a minute per month.
  timeout_seconds: 300
  # Rows dropped as they load, to fit Neon's free-tier storage. The archive keeps every
  # response, so a wider filter can be reloaded with `--from-archive`.
  filters:
    hs:
      drop_country_groups: true # SUMMARY_LVL = CGP, sums of individual countries
      drop_all_zero: true # every value, weight and quantity is zero
    porths: &origins_only
      drop_country_groups: true
      drop_all_zero: true
      origins_only: true # countries in config/origins.yaml, and the all-countries total
    statehs: *origins_only

census_state_port:
  url_template: https://www.census.gov/trade/downloads/additional/ISTPORT/ISTPORT{yy}Q{quarter}.ZIP
  origins_only: true # countries in config/origins.yaml
  # Destination states loaded: the ones the case analyses look at. Every state doesn't fit in the
  # free tier.
  states:
    - VA
    - GA
    - OH
    - CA
    - OR
    - WA
    - AZ
    - TX
    - IL
  drop_rows_without_air_or_vessel_weight: true

bts_transborder:
  # Monthly ZIPs downloaded by hand from https://www.bts.gov/topics/transborder-raw-data
  manual_dir: data/manual/bts
  tables: [dot2, dot3]

bts_t100:
  # T-100 International Segment (All Carriers): nonstop flight segments to and from the US, by US
  # and foreign carriers. The download form returns one year per request.
  form_url: https://www.transtats.bts.gov/DL_SelectFields.aspx?gnoyr_VQ=FJE&QO_fu146_anzr=Nv4+Pn44vr45
  origins_only: true # origin airports in countries in config/origins.yaml
  drop_rows_without_freight: true # passenger- or mail-only segments

portwatch:
  query_url: https://services9.arcgis.com/weJ1QsnbMYJlCHdG/arcgis/rest/services/Daily_Chokepoints_Data/FeatureServer/0/query
  # PortWatch IDs; names come from the source. The page size is read from the layer's metadata.
  chokepoints:
    - chokepoint1 # Suez Canal
    - chokepoint2 # Panama Canal
    - chokepoint4 # Bab el-Mandeb Strait
    - chokepoint7 # Cape of Good Hope

climatetrace:
  table: trace-data-383422.climate_trace.shipping_voyages
  # Origins are the countries in config/origins.yaml, by their ISO3 codes in seed_census_countries;
  # the destination is always the United States.
  # All ship types on these lanes are loaded (about 70k voyages for 2022 onward); core filters to
  # container ships ("container" from OceanMind, "cargo.container" from Global Fishing Watch).

emission_factors:
  # Workbooks loaded by `shockt ingest uk-ghg-factors`, `epa-ghg-hub`, `cbam-default-values` and
  # `open-ceda`. core.ref_emission_factors derives every freight factor from the UK and EPA ones.
  uk:
    url: https://assets.publishing.service.gov.uk/media/6a6c9748862aaf18d9c62ac9/ghg-conversion-factors-2026-flat-format-revised.xlsx
    version: "2026 (revised July 2026)"
    publication: https://www.gov.uk/government/publications/greenhouse-gas-reporting-conversion-factors-2026
  epa:
    url: https://www.epa.gov/system/files/other-files/2025-01/ghg-emission-factors-hub-2025.xlsx
    version: "2025"
    publication: https://www.epa.gov/climateleadership/ghg-emission-factors-hub
  cbam:
    # EU CBAM default values for the definitive period, one sheet per country. The URL serves the
    # current version of the file whatever its filename says; the loaded version is read from the
    # workbook's Version History sheet.
    url: https://taxation-customs.ec.europa.eu/document/download/1c05d211-80cb-4aaa-8ef0-e08005a95d7e_en?filename=DVs%20as%20adopted_v20260204%20.xlsx
    version: "Annex I default values, Implementing Regulation (EU) 2026/1740"
    publication: https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en
  open_ceda:
    # Watershed's Open CEDA (now the Cornerstone EEIO model): spend-based cradle-to-gate factors,
    # kgCO2e per US dollar of output by country and industry. Only the `GHG_t_Raw` sheet is
    # loaded; the other sheets adjust it for year, currency and price type.
    url: https://open-ceda.s3.us-west-2.amazonaws.com/data/Open%20CEDA%202025%20by%20Watershed.xlsx
    version: "Open CEDA 2025"
    publication: https://registry.opendata.aws/open-ceda/

census_schedules:
  # Census reference lists of country codes (Schedule C) and districts and ports (Schedule D).
  schedule_c_url: https://www.census.gov/foreign-trade/schedules/c/country.txt
  schedule_d_url: https://www.census.gov/foreign-trade/schedules/d/distcode.html
  # Census-specific ISO2 codes with no ISO 3166 entry, mapped to the ISO3 code other sources (such
  # as Climate TRACE) use. A Census code without an entry here or in ISO 3166 gets no ISO3.
  iso3_overrides:
    GZ: PSE # Gaza Strip
    WE: PSE # West Bank

country_names:
  # Country-name variants used by CBAM, SBTi and other sources that don't carry an ISO3 code.
  # `shockt ref country-names` generates seed_country_names.csv from ISO 3166 (pycountry) and the
  # Census Schedule C seed; these overrides cover source-specific spellings that neither provides.
  overrides:
    "Congo, Democratic Republic of": COD
    "Ivory Coast": CIV
    "Korea, Republic of (South Korea)": KOR
    "New Caledonia and dependencies": NCL
    "Republic of Korea": KOR
    "Netherlands (Kingdom of the)": NLD
    "China, Hong Kong Special Administrative Region": HKG
    "China, Macao Special Administrative Region": MAC
    "Bolivia (Plurinational State of)": BOL

reference_sources:
  # Reference datasets loaded into raw for placing nodes (plan section 6.2). Each is one
  # `latest` partition; a reload replaces the previous snapshot.
  ourairports:
    url: https://davidmegginson.github.io/ourairports-data/airports.csv
  geonames_cities:
    url: https://download.geonames.org/export/dump/cities5000.zip
    countries: [US, MX]
  bts_border_crossings:
    url: https://data.bts.gov/resource/keg4-3bc2.json
    border: US-Mexico Border
    page_size: 5000
  census_import_concordance:
    # One workbook per year, mapping each HS-10 import commodity to NAICS, SITC and end use.
    url_template: https://www.census.gov/foreign-trade/reference/codes/concordance/impconcord{yy}.xlsx
  denue:
    # INEGI DENUE, manufacturing (SCIAN 31-33). Only establishments in industries the import
    # concordance maps from the case HS codes are kept, matched at the five-digit industry level,
    # where the US, Canada and Mexico agreed a comparable classification (2022 NAICS Manual,
    # https://www.census.gov/naics/reference_files_tools/2022_NAICS_Manual.pdf).
    url: https://www.inegi.org.mx/contenidos/masiva/denue/denue_00_31-33_csv.zip
    industry_digits: 5
    # Cases whose HS codes select DENUE industries: the ones whose route runs through a Mexican
    # assembly site.
    cases:
      - tariffs_2025

thetis_mrv:
  # EMSA THETIS-MRV: annual per-ship fuel consumption and emissions under EU MRV Regulation
  # 2015/757. The xlsx is generated daily from https://mrv.emsa.europa.eu; no API key needed.
  downloadable_files_url: https://mrv.emsa.europa.eu/api/public-emission-report/downloadable-files
  download_url_template: https://mrv.emsa.europa.eu/api/public-emission-report/reporting-period-document/binary/{year}/{version}
  # Reporting years to load. The date_range controls the analysis months; these control which
  # annual MRV snapshots are archived and parsed. null resolves to the latest available.
  start_year: 2022
  end_year: null

comext:
  # Eurostat Comext DS-059334: extra-EU trade by mode of transport, at HS-6.
  # SDMX 2.1 REST API; no API key needed. Full-dataset downloads are disabled; filters required.
  base_url: https://ec.europa.eu/eurostat/api/comext/dissemination/sdmx/2.1
  dataset: DS-059334
  flow: "1"            # imports
  indicators:
    - QUANTITY_KG
    - VALUE_EUR
  timeout_seconds: 120
  # Census Schedule C codes that are not valid Eurostat partner codes.
  # GZ (Gaza) and WE (West Bank) → PS (Palestine, State of) in Comext.
  partner_overrides:
    GZ: PS
    WE: PS

oecd_maritime:
  # OECD experimental maritime transport CO2 emissions: monthly tonnes of CO2 by the country where
  # the operating company resides, from 2019. SDMX 2.1 REST API; no API key needed.
  base_url: https://sdmx.oecd.org/public/rest
  dataflow: OECD.SDD.NAD.SEEA,DSD_MARITIME_TRANSPORT@DF_MARITIME_TRANSPORT,1.0
  timeout_seconds: 120

sbti:
  # Science Based Targets initiative Target Dashboard downloads, refreshed weekly. The by-target
  # workbook has one row per company target or commitment, the by-company one a row per company.
  companies_url: https://files.sciencebasedtargets.org/production/files/companies-excel.xlsx
  targets_url: https://files.sciencebasedtargets.org/production/files/targets-excel.xlsx
  publication: https://sciencebasedtargets.org/target-dashboard

distances:
  # Generators that write the distance seeds (plan section 6.3), between the node pairs in
  # core.fct_node_weights_monthly.
  sea:
    # Passages closed in each scenario, by searoute's names. `northwest` is searoute's own default:
    # the Northwest Passage is closed in every scenario.
    scenarios:
      open:
        - northwest
      panama_closed:
        - northwest
        - panama
      red_sea_closed:
        - northwest
        - babalmandab
      panama_and_red_sea_closed:
        - northwest
        - panama
        - babalmandab
  road:
    # Heavy-goods-vehicle profile. A matrix request accepts up to 3,500 origins × destinations
    # (https://openrouteservice.org/restrictions/).
    matrix_url: https://api.openrouteservice.org/v2/matrix/driving-hgv
    max_cells_per_request: 3500
  rail:
    lines_url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_North_American_Rail_Network_Lines/FeatureServer/0
    nodes_url: https://services.arcgis.com/xOi1kZaI0eWDREZv/arcgis/rest/services/NTAD_North_American_Rail_Network_Nodes/FeatureServer/0
    # Active track, by the layer's NET codes: main line, major and minor industrial leads, long
    # sidings, yards and rail ferries. Out-of-service, abandoned, trail and transit-only lines are
    # left out.
    track_classes: [M, I, O, S, Y, F]
    page_size: 2000
    # Nevada's population centre is 114 km from track, the farthest of the destination states.
    max_snap_km: 150
