[project]
name = "shockt-analysis"
version = "0.1.0"
description = "ShockT Climate analysis notebooks and the reader that loads core into data frames."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "matplotlib>=3.9",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "polars>=1.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "shockt-engine",
]

[tool.uv.sources]
shockt-engine = { path = "../engine", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shockt_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
