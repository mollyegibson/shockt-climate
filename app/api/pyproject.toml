[project]
name = "shockt-api"
version = "0.1.0"
description = "FastAPI backend for the ShockT Climate route calculator."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "uvicorn[standard]>=0.32",
  "shockt-engine",
]

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.0",
  "ruff>=0.6",
  "testcontainers>=4.10",
  "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shockt_api"]

[tool.uv.sources]
shockt-engine = { path = "../../engine", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
